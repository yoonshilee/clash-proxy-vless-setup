<style>
/* Hallmark · macrostructure: workspace · tone: restrained · anchor hue: teal */
:root{--paper:oklch(97% .008 180);--surface:oklch(100% 0 0);--ink:oklch(24% .025 190);--muted:oklch(48% .025 190);--line:oklch(89% .015 180);--accent:oklch(45% .09 180);--soft:oklch(94% .035 175);--danger:oklch(49% .17 25);--body:system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0;overflow-x:clip}body{font-family:var(--body);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.5}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{border:0;border-radius:7px;background:var(--accent);color:var(--surface);padding:10px 16px;font-weight:650;cursor:pointer;white-space:nowrap}button:hover{opacity:.88}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.secondary{background:var(--surface);color:var(--accent);border:1px solid var(--line)}.quiet{padding:0;background:none;color:var(--muted)}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 max(24px,calc((100% - 1120px)/2));border-bottom:1px solid var(--line);background:var(--surface);gap:20px}.brand{font-size:18px;font-weight:750;white-space:nowrap}.brand-mark{color:var(--accent);font-size:24px;margin-right:6px}.topbar nav{display:flex;align-items:center;gap:24px;white-space:nowrap;color:var(--muted);font-size:14px}.topbar nav a:hover{color:var(--accent)}main{max-width:1120px;margin:0 auto;padding:56px 24px 80px}.heading,.section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}h1,h2,p{margin:0}h1{font-size:clamp(32px,5vw,48px);letter-spacing:-.045em;line-height:1.1;overflow-wrap:anywhere}h2{font-size:20px;letter-spacing:-.02em}.eyebrow{font-size:11px;letter-spacing:.11em;font-weight:750;color:var(--accent);margin-bottom:12px}.muted{color:var(--muted);margin-top:8px}.badge{font-size:12px;color:var(--accent);background:var(--soft);padding:7px 10px;border-radius:20px;white-space:nowrap}.filter{margin-top:32px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:10px}.range{display:flex;align-items:end;gap:16px}.range label,.field{display:grid;gap:6px;font-size:13px;font-weight:650}.range label{flex:1;min-width:0}input,select{width:100%;min-width:0;padding:9px 10px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px}input:focus,select:focus{border-color:var(--accent)}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:32px 0 48px}.summary>div{padding:4px 24px;border-left:1px solid var(--line)}.summary>div:first-child{padding-left:0;border:0}.summary span{display:block;color:var(--muted);font-size:11px;letter-spacing:.1em;font-weight:700}.summary strong{display:block;font-size:28px;letter-spacing:-.03em;margin-top:8px}.table-section{border-top:1px solid var(--line);padding-top:28px}.table-wrap{overflow-x:auto;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;text-align:left}th,td{padding:14px 18px;border-bottom:1px solid var(--line)}thead th{font-size:11px;letter-spacing:.08em;color:var(--muted)}tbody th{font-weight:600;overflow-wrap:anywhere}tbody tr:last-child>*{border:0}.empty{text-align:center;color:var(--muted);padding:40px}.login{max-width:380px;margin:70px auto}.login form{margin-top:32px}.login form p{margin-bottom:18px}.login label{display:block;font-weight:650;margin-bottom:5px}.settings-form{max-width:680px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:32px;padding:24px;background:var(--surface);border:1px solid var(--line);border-radius:10px}.settings-form button{justify-self:start}.field small{font-weight:400;color:var(--muted)}.notice{padding:12px 16px;background:var(--soft);border-radius:7px;margin-bottom:20px}.errorlist{color:var(--danger);font-size:13px;padding-left:18px;margin:5px 0}@media(max-width:600px){.topbar{height:auto;min-height:68px;align-items:flex-start;flex-wrap:wrap;padding:16px}.topbar nav{gap:16px;flex-wrap:wrap}.heading,.section-heading{align-items:flex-start;flex-direction:column}.range{align-items:stretch;flex-direction:column}.summary strong{font-size:20px}.summary>div{padding:4px 12px}.settings-form{grid-template-columns:minmax(0,1fr)}main{padding:40px 16px 60px}}
.sort-button{padding:0;background:transparent;color:inherit;font-size:inherit;letter-spacing:inherit;font-weight:inherit}.sort-button span{color:var(--accent);margin-left:2px}
</style>
